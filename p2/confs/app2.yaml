apiVersion: v1
kind: Namespace
metadata:
  name: ns2

---

apiVersion: v1
kind: ConfigMap
metadata:
  namespace: ns2
  name: conf-map-1
data:
  app2.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>App 2</title>
      <style>
        body {
          font-family: system-ui, sans-serif;
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          margin: 0;
          background: #1e3a8a;
          color: white;
        }
        h1 { font-size: 4rem; }
      </style>
    </head>
    <body>
      <h1>App 2</h1>
    </body>
    </html>

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-2
  namespace: ns2
  labels:
    deployment: deployment-2
spec:
  replicas: 1 # (default)
  selector:
    matchLabels:
      app: app2
  
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: nginx:alpine
          ports: # It does nothing
            - name: http
              containerPort: 80
              protocol: TCP

          volumeMounts:
            - mountPath: /usr/share/nginx/html/index.html
              name: app2-src
              subPath: app2.html

      volumes:
        - name: app2-src
          configMap:
            name: conf-map-1

---

apiVersion: v1
kind: Service
metadata:
  namespace: ns2
  name: app2
spec:
  type: ClusterIP # (default)
  selector:
    app: app2
  ports:
    - protocol: TCP
      name: http
      port: 8000
      targetPort: 80

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps
  namespace: ns2
spec:
  rules:
    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app2
                port:
                  name: http


